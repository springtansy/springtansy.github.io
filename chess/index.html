<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Chess</title>
    <link rel="stylesheet" href="stylesheets/menustyle.css">
</head>

<body>

    <main class="menu">
        <h1>Chess</h1>

        <div class="game-modes">
            <button class="selected" data-style="whitebot">Play White</button>
            <button data-style="blackbot">Play Black</button>
            <button data-style="twoplayer">2 Players</button>
        </div>

        <div class="bot-selection">
            <h2>Choose your opponent</h2>

            <div class="bot-list" id="bot-list"></div>
        </div>

        <button id="start-game">Start Game</button>    
    </main>

    <script src="menu.js"></script>

</body>
</html>
